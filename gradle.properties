# Use AndroidX
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Disable built-in Kotlin if necessary (though we might not need it if we're not using AGP 9.0+)
# Actually, I set AGP to 8.5.2 in build.gradle, so built-in Kotlin shouldn't be active unless it's the default in Gradle 9.0
android.builtInKotlin=false
